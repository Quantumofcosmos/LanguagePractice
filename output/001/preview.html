<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview 001</title>
<style>
body {
    margin: 0;
    padding: 32px;
    background: #ddd;
    font-family: sans-serif;
}

h1 {
    margin: 0 0 24px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 432px);
    gap: 24px;
    align-items: start;
}

.card {
    background: white;
    padding: 8px;
    box-shadow: 0 3px 18px rgba(0,0,0,.12);
}

.preview-frame {
    width: 432px;
    height: 540px;
    overflow: hidden;
}

iframe {
    width: 1080px;
    height: 1350px;
    border: 0;
    display: block;
    transform: scale(0.4);
    transform-origin: top left;
}

.name {
    padding: 8px 2px 2px;
    font-size: 14px;
}
</style>
</head>
<body>
<h1>Post 001</h1>
<div class="grid">

<div class="card">
    <div class="preview-frame">
        <iframe src="01-cover.html"></iframe>
    </div>
    <div class="name">01-cover</div>
</div>

<div class="card">
    <div class="preview-frame">
        <iframe src="02-chinese.html"></iframe>
    </div>
    <div class="name">02-chinese</div>
</div>

<div class="card">
    <div class="preview-frame">
        <iframe src="03-japanese.html"></iframe>
    </div>
    <div class="name">03-japanese</div>
</div>

<div class="card">
    <div class="preview-frame">
        <iframe src="04-german.html"></iframe>
    </div>
    <div class="name">04-german</div>
</div>

<div class="card">
    <div class="preview-frame">
        <iframe src="05-connections.html"></iframe>
    </div>
    <div class="name">05-connections</div>
</div>

<div class="card">
    <div class="preview-frame">
        <iframe src="06-field-note.html"></iframe>
    </div>
    <div class="name">06-field-note</div>
</div>

</div>
</body>
</html>
