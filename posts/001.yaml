type: vocabulary
number: 1
title: People
subtitle: Five core words for talking about people
concepts:
- english: I / me
  chinese:
    text: 我
    reading: wǒ
  japanese:
    text: 私
    kana: わたし
    reading: watashi
  german:
    text: ich
- english: you
  chinese:
    text: 你
    reading: nǐ
  japanese:
    text: あなた
    reading: anata
    note: Often omitted; names/titles are common.
  german:
    text: du
    note: Informal singular.
- english: he
  chinese:
    text: 他
    reading: tā
  japanese:
    text: 彼
    kana: かれ
    reading: kare
  german:
    text: er
- english: she
  chinese:
    text: 她
    reading: tā
  japanese:
    text: 彼女
    kana: かのじょ
    reading: kanojo
  german:
    text: sie
- english: we
  chinese:
    text: 我们
    reading: wǒmen
  japanese:
    text: 私たち
    kana: わたしたち
    reading: watashitachi
  german:
    text: wir
usage:
- english: I am …
  chinese: 我是……
  chinese_reading: wǒ shì…
  japanese: 私は……です
  japanese_kana: わたしは……です
  japanese_reading: watashi wa … desu
  german: Ich bin …
- english: And you?
  chinese: 你呢？
  chinese_reading: nǐ ne?
  japanese: あなたは？
  japanese_reading: anata wa?
  german: Und du?
note: Japanese pronouns are often omitted when context makes the person clear.
