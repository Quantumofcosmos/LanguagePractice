<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview {{ "%03d"|format(post.number) }}</title>
<style>
body {
    margin: 0;
    padding: 32px;
    background: #ddd;
    font-family: sans-serif;
}

h1 {
    margin: 0 0 24px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 432px);
    gap: 24px;
    align-items: start;
}

.card {
    background: white;
    padding: 8px;
    box-shadow: 0 3px 18px rgba(0,0,0,.12);
}

.preview-frame {
    width: 432px;
    height: 540px;
    overflow: hidden;
}

iframe {
    width: 1080px;
    height: 1350px;
    border: 0;
    display: block;
    transform: scale(0.4);
    transform-origin: top left;
}

.name {
    padding: 8px 2px 2px;
    font-size: 14px;
}
</style>
</head>
<body>
<h1>Post {{ "%03d"|format(post.number) }}</h1>
<div class="grid">
{% for stem, filename in slides %}
<div class="card">
    <div class="preview-frame">
        <iframe src="{{ filename }}"></iframe>
    </div>
    <div class="name">{{ stem }}</div>
</div>
{% endfor %}
</div>
</body>
</html>
